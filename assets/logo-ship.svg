<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgRadial" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#101044"/>
      <stop offset="45%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>

    <linearGradient id="hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b2f3ff"/>
      <stop offset="18%" stop-color="#4fd8ff"/>
      <stop offset="45%" stop-color="#00a8d6"/>
      <stop offset="70%" stop-color="#005f8a"/>
      <stop offset="100%" stop-color="#002c4d"/>
    </linearGradient>
    <linearGradient id="hullRim" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wingL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86e6ff"/>
      <stop offset="40%" stop-color="#31c1ec"/>
      <stop offset="75%" stop-color="#0a75a8"/>
      <stop offset="100%" stop-color="#04334f"/>
    </linearGradient>
    <linearGradient id="wingR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86e6ff"/>
      <stop offset="40%" stop-color="#31c1ec"/>
      <stop offset="75%" stop-color="#0a75a8"/>
      <stop offset="100%" stop-color="#04334f"/>
    </linearGradient>
    <linearGradient id="edgeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="cockpit" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#9ff2ff"/>
      <stop offset="70%" stop-color="#1fb8e0"/>
      <stop offset="100%" stop-color="#0a4a66"/>
    </radialGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#c8fbff"/>
      <stop offset="55%" stop-color="#00e5ff"/>
      <stop offset="80%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="36" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(512, 520)">
    <!-- ===== ENGINES / FLAMES (behind ship) ===== -->
    <g filter="url(#glowMed)">
      <polygon points="-118,92 -78,86 -88,190 -118,188" fill="url(#flame)" opacity="0.9"/>
      <polygon points="118,92 78,86 88,190 118,188" fill="url(#flame)" opacity="0.9"/>
    </g>
    <g filter="url(#glowSoft)">
      <polygon points="-104,96 -86,92 -92,140 -104,140" fill="#ffffff" opacity="0.8"/>
      <polygon points="104,96 86,92 92,140 104,140" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- ===== WINGS ===== -->
    <path d="M -30,10 L -300,120 L -270,168 L -92,150 L -38,58 Z" fill="url(#wingL)"/>
    <path d="M -30,10 L -300,120 L -282,126 L -46,30 Z" fill="url(#edgeAccent)" opacity="0.55"/>
    <path d="M -38,58 L -270,168 L -92,150 Z" fill="#003049" opacity="0.35"/>
    <path d="M 30,10 L 300,120 L 270,168 L 92,150 L 38,58 Z" fill="url(#wingR)"/>
    <path d="M 30,10 L 300,120 L 282,126 L 46,30 Z" fill="url(#edgeAccent)" opacity="0.55"/>
    <path d="M 38,58 L 270,168 L 92,150 Z" fill="#003049" opacity="0.35"/>

    <circle cx="-300" cy="120" r="14" fill="#00e5ff" opacity="0.9" filter="url(#glowSoft)"/>
    <circle cx="-300" cy="120" r="6" fill="#ffffff"/>
    <circle cx="300" cy="120" r="14" fill="#00e5ff" opacity="0.9" filter="url(#glowSoft)"/>
    <circle cx="300" cy="120" r="6" fill="#ffffff"/>

    <!-- ===== MAIN HULL ===== -->
    <path d="M 0,-210 L -32,-40 L -44,96 C -24,138 24,138 44,96 L 32,-40 Z" fill="#003049"/>
    <path d="M 0,-210 L -34,-35 L -46,92 C -22,140 22,140 46,92 L 34,-35 Z" fill="url(#hull)"/>
    <path d="M 0,-208 L -30,-30 L -40,90 C -20,132 20,132 40,90 L 30,-30 Z" fill="url(#hullRim)" opacity="0.5"/>
    <path d="M 0,-205 L 0,120" stroke="#eafdff" stroke-width="7" opacity="0.35" stroke-linecap="round"/>

    <path d="M -6,-208 L 0,-214 L 6,-208 L 0,-30 Z" fill="#ffffff" opacity="0.85"/>
    <circle cx="0" cy="-202" r="6" fill="#ffffff" opacity="0.95" filter="url(#glowSoft)"/>

    <!-- ===== COCKPIT ===== -->
    <path d="M -20,-58 C -20,-92 -16,-104 0,-112 C 16,-104 20,-92 20,-58 C 20,-40 -20,-40 -20,-58 Z" fill="url(#cockpit)"/>
    <path d="M -13,-70 C -13,-88 -9,-98 0,-104 C -4,-100 -9,-98 -13,-95 Z" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="-9" cy="-76" rx="4" ry="10" fill="#ffffff" opacity="0.8"/>

    <!-- ===== SIDE ENGINE HOUSINGS ===== -->
    <rect x="-118" y="18" width="34" height="68" rx="8" fill="#00506f"/>
    <rect x="-112" y="22" width="22" height="60" rx="6" fill="url(#hull)"/>
    <rect x="84" y="18" width="34" height="68" rx="8" fill="#00506f"/>
    <rect x="90" y="22" width="22" height="60" rx="6" fill="url(#hull)"/>

    <ellipse cx="-101" cy="88" rx="14" ry="8" fill="#0a4a66"/>
    <ellipse cx="-101" cy="88" rx="8" ry="4" fill="#00e5ff" filter="url(#glowSoft)"/>
    <ellipse cx="101" cy="88" rx="14" ry="8" fill="#0a4a66"/>
    <ellipse cx="101" cy="88" rx="8" ry="4" fill="#00e5ff" filter="url(#glowSoft)"/>

    <ellipse cx="0" cy="118" rx="14" ry="9" fill="#0a4a66"/>
    <ellipse cx="0" cy="114" rx="8" ry="4" fill="#00e5ff" filter="url(#glowSoft)"/>

    <path d="M -10,124 C -14,150 -4,180 0,188 C 4,180 14,150 10,124 Z" fill="url(#flame)" filter="url(#glowMed)"/>
    <path d="M -5,122 C -7,142 -1,158 0,164 C 1,158 7,142 5,122 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
